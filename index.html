<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude PDP — Luciano</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222;
  --border:rgba(255,255,255,0.08);--border-hi:rgba(255,255,255,0.15);
  --text:#f0ede8;--muted:#888880;--dim:#444440;
  --qe:#1D9E75;--qe-bg:rgba(29,158,117,0.13);
  --people:#7F77DD;--people-bg:rgba(127,119,221,0.13);
  --padel:#D85A30;--padel-bg:rgba(216,90,48,0.13);
  --auto:#EF9F27;--auto-bg:rgba(239,159,39,0.13);
  --rev:#888780;--rev-bg:rgba(136,135,128,0.13);
  --r:10px;--rs:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{width:260px;flex-shrink:0;background:var(--surface);border-right:.5px solid var(--border);padding:24px 0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.main{flex:1;padding:32px 40px;max-width:880px}

/* Sidebar */
.sb-brand{padding:0 20px 20px;border-bottom:.5px solid var(--border);margin-bottom:16px}
.sb-title{font-family:'DM Serif Display',serif;font-size:18px;margin-bottom:3px}
.sb-sub{font-size:11px;color:var(--muted)}
.ring-wrap{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface2);margin:0 12px 4px;border-radius:var(--r)}
.ring-val{font-size:22px;font-weight:500}
.ring-lbl{font-size:11px;color:var(--muted)}

/* Sync status */
.sync-row{display:flex;align-items:center;gap:7px;padding:8px 16px 14px;font-size:11px;color:var(--muted)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex-shrink:0;transition:background .3s}
.sync-dot.ok{background:var(--qe)}
.sync-dot.busy{background:var(--auto);animation:blink 1s infinite}
.sync-dot.err{background:#E24B4A}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* Phase nav */
.sb-sec{padding:0 12px;margin-bottom:4px}
.sb-sec-lbl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;padding:0 8px;margin-bottom:6px}
.ph-btn{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--rs);cursor:pointer;border:none;background:none;width:100%;text-align:left;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;transition:background .12s,color .12s}
.ph-btn:hover,.ph-btn.active{background:var(--surface2);color:var(--text)}
.ph-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.ph-cnt{margin-left:auto;font-size:11px;color:var(--dim)}

/* Footer */
.sb-footer{margin-top:auto;padding:16px 12px 0;border-top:.5px solid var(--border);display:flex;flex-direction:column;gap:8px}
.connect-btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:9px 12px;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;width:100%;border:none;transition:opacity .15s}
.connect-btn.signin{background:#fff;color:#1a1a1a}
.connect-btn.signin:hover{opacity:.88}
.connect-btn.signout{background:var(--surface2);color:var(--muted);border:.5px solid var(--border-hi)}
.connect-btn.signout:hover{color:var(--text)}
.ical-btn{display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:var(--rs);background:var(--auto-bg);color:var(--auto);border:.5px solid rgba(239,159,39,.3);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;width:100%;text-decoration:none;transition:background .15s}
.ical-btn:hover{background:rgba(239,159,39,.22)}

/* Setup card */
.setup-card{background:var(--surface);border:.5px solid var(--border-hi);border-radius:var(--r);padding:24px;margin-bottom:28px}
.setup-title{font-family:'DM Serif Display',serif;font-size:18px;margin-bottom:6px}
.setup-desc{font-size:13px;color:var(--muted);line-height:1.65;margin-bottom:20px}
.setup-steps{display:flex;flex-direction:column;gap:11px;margin-bottom:20px}
.step{display:flex;gap:11px;align-items:flex-start}
.step-n{width:22px;height:22px;border-radius:50%;background:var(--surface2);border:.5px solid var(--border-hi);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0;margin-top:1px}
.step-t{font-size:13px;color:var(--muted);line-height:1.5}
.step-t strong{color:var(--text)}
.step-t code{font-family:monospace;font-size:11px;background:var(--surface2);padding:1px 5px;border-radius:3px;color:var(--auto)}
.field-row{display:flex;gap:8px;margin-bottom:8px}
.field{flex:1;padding:9px 12px;border-radius:var(--rs);border:.5px solid var(--border-hi);background:var(--surface2);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none}
.field:focus{border-color:var(--people)}
.btn-save{padding:9px 20px;border-radius:var(--rs);background:var(--text);color:var(--bg);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;border:none;cursor:pointer;transition:opacity .15s}
.btn-save:hover{opacity:.85}
.err-msg{font-size:12px;color:#E24B4A;margin-top:4px;display:none}

/* Today banner */
.today-banner{background:var(--surface);border:.5px solid var(--border-hi);border-radius:var(--r);padding:20px 24px;margin-bottom:28px;display:flex;gap:20px;align-items:flex-start}
.today-left{flex:1;min-width:0}
.today-eye{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.today-title{font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:8px;line-height:1.2}
.today-meta{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.today-instr{font-size:13px;color:var(--muted);line-height:1.65;margin-bottom:14px}
.today-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn-go{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--rs);background:var(--text);color:var(--bg);font-size:12px;font-weight:500;font-family:'DM Sans',sans-serif;border:none;cursor:pointer;text-decoration:none;transition:opacity .15s}
.btn-go:hover{opacity:.85}
.btn-check{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--rs);background:none;color:var(--muted);border:.5px solid var(--border-hi);font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s}
.btn-check:hover{border-color:var(--qe);color:var(--qe)}
.timer-col{flex-shrink:0;display:flex;flex-direction:column;gap:4px}
.trow{display:flex;align-items:center;gap:8px}
.tblock{height:22px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500}
.tname{font-size:10px;color:var(--dim);white-space:nowrap}
.timer-lbl{font-size:10px;color:var(--dim);text-align:center;margin-bottom:2px}

/* Phase header */
.ph-hdr{margin-bottom:20px}
.ph-hdr-title{font-family:'DM Serif Display',serif;font-size:19px;margin-bottom:4px}
.ph-hdr-desc{font-size:12px;color:var(--muted);line-height:1.6}

/* Session list */
.wk-group{margin-bottom:26px}
.wk-label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.wk-label::after{content:'';flex:1;height:.5px;background:var(--border)}
.srow{display:flex;align-items:flex-start;gap:13px;padding:11px 15px;border-radius:var(--rs);border:.5px solid var(--border);background:var(--surface);margin-bottom:5px;cursor:pointer;transition:border-color .15s}
.srow:hover{border-color:var(--border-hi)}
.srow.done{background:rgba(29,158,117,.06);border-color:rgba(29,158,117,.18);opacity:.65}
.srow.is-next{border-color:var(--muted)}
.chk{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--border-hi);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;background:none;transition:all .15s;margin-top:1px}
.chk:hover{border-color:var(--qe)}
.chk.done{background:var(--qe);border-color:var(--qe)}
.chk svg{display:none}.chk.done svg{display:block}
.sc{flex:1;min-width:0}
.s-top{display:flex;align-items:center;gap:7px;margin-bottom:3px;flex-wrap:wrap}
.s-day{font-size:10px;color:var(--dim)}
.s-title{font-size:13px;font-weight:500}
.s-title.x{text-decoration:line-through;opacity:.45}
.pill{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500}
.next-tag{font-size:10px;color:var(--auto);font-weight:500}
.s-instr{font-size:12px;color:var(--muted);line-height:1.7;margin-top:5px;display:none}
.s-instr b{color:var(--text);font-weight:500}
.s-instr .seg{display:block;margin-bottom:7px}
.s-instr .seg:last-child{margin-bottom:0}
.s-acts{display:none;gap:8px;margin-top:8px;flex-wrap:wrap}
.srow.open .s-instr{display:block}
.srow.open .s-acts{display:flex}
.lnk{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);padding:3px 9px;border:.5px solid var(--border-hi);border-radius:20px;text-decoration:none;transition:color .15s,border-color .15s}
.lnk:hover{color:var(--text);border-color:var(--muted)}
.done-btn{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 10px;border:.5px solid rgba(29,158,117,.4);border-radius:20px;background:none;cursor:pointer;color:var(--muted);font-family:'DM Sans',sans-serif;transition:all .15s}
.done-btn:hover{background:var(--qe);color:#fff;border-color:var(--qe)}
.srow.done .done-btn{background:var(--qe);color:#fff;border-color:var(--qe);pointer-events:none}

@media(max-width:700px){.sidebar{display:none}.main{padding:20px 16px}.today-banner{flex-direction:column}}
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="sb-brand">
      <div class="sb-title">Claude PDP</div>
      <div class="sb-sub">Luciano · 12 weeks · 8:30am</div>
    </div>

    <div class="ring-wrap">
      <svg width="48" height="48" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="20" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="3.5"/>
        <circle id="ring" cx="24" cy="24" r="20" fill="none" stroke="#1D9E75" stroke-width="3.5"
          stroke-dasharray="125.6" stroke-dashoffset="125.6" stroke-linecap="round"
          transform="rotate(-90 24 24)" style="transition:stroke-dashoffset .6s ease"/>
      </svg>
      <div>
        <div class="ring-val" id="ring-pct">0%</div>
        <div class="ring-lbl"><span id="done-ct">0</span> / 48 sessions</div>
      </div>
    </div>

    <div class="sync-row">
      <div class="sync-dot" id="sdot"></div>
      <span id="slbl">Not signed in</span>
    </div>

    <div class="sb-sec">
      <div class="sb-sec-lbl">Phases</div>
      <button class="ph-btn active" id="btn-all" onclick="showPhase('all')">
        <div class="ph-dot" style="background:var(--rev)"></div>All sessions<span class="ph-cnt">48</span>
      </button>
      <button class="ph-btn" id="btn-1" onclick="showPhase(1)">
        <div class="ph-dot" style="background:var(--qe)"></div>Foundation<span class="ph-cnt">12</span>
      </button>
      <button class="ph-btn" id="btn-2" onclick="showPhase(2)">
        <div class="ph-dot" style="background:var(--people)"></div>Applied<span class="ph-cnt">16</span>
      </button>
      <button class="ph-btn" id="btn-3" onclick="showPhase(3)">
        <div class="ph-dot" style="background:var(--padel)"></div>Advanced<span class="ph-cnt">12</span>
      </button>
      <button class="ph-btn" id="btn-4" onclick="showPhase(4)">
        <div class="ph-dot" style="background:var(--auto)"></div>Automation<span class="ph-cnt">8</span>
      </button>
    </div>

    <div class="sb-footer">
      <button class="connect-btn signin" id="signin-btn" onclick="signIn()" style="display:none">
        <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Sign in with Google
      </button>
      <button class="connect-btn signout" id="signout-btn" onclick="signOut()" style="display:none">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </button>
      <a class="ical-btn" href="claude_pdp_schedule.ics" download>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Calendar file (48 events)
      </a>
    </div>
  </aside>

  <main class="main" id="main-content">
    <!-- filled by JS -->
  </main>
</div>

<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async></script>

<script>
// ─────────────────────────────────────────────
// CONFIG — filled in by user once
// ─────────────────────────────────────────────
const CONFIG_KEY = 'pdp_gsheets_config';
const HARDCODED_CFG = {
  clientId: '308835955166-f2ahsv1eu7370oq0bbq387o7juevap76.apps.googleusercontent.com',
  sheetId: '16bRdXJ8YgENoWw59e6DWkjvEozqQddyYMoGvX7qwIn0'
};
let cfg = HARDCODED_CFG;
localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
// cfg = { clientId, sheetId }

// ─────────────────────────────────────────────
// SESSION DATA
// ─────────────────────────────────────────────
const SESSIONS = [
  // ── Phase 1 · Foundation ──────────────────────────────────────────────────
  {id:0,w:1,p:1,day:"Mon",title:"Intro to Claude AI",track:"QE",
   url:"https://anthropic.skilljar.com/claude-101",
   instr:'<span class="seg"><b>Activate (5 min):</b> Open Claude.ai and type one sentence about what you do as a QE manager. See how it responds to context.</span><span class="seg"><b>Learn (15 min):</b> Watch the first module of Anthropic\'s free <em>Intro to Claude AI</em> course. Focus on how Claude reasons differently from a search engine — it understands context, not just keywords.</span><span class="seg"><b>Apply (5 min):</b> Ask Claude to summarize a real QE defect you\'re working on right now in 3 bullet points. Note how it interprets your input.</span>'},
  {id:1,w:1,p:1,day:"Tue",title:"Prompt Engineering Fundamentals — Pt 1",track:"QE",
   url:"https://anthropic.skilljar.com/claude-101",
   instr:'<span class="seg"><b>Activate (5 min):</b> Pick one Jira ticket that has an unclear description. Paste it into a note — you\'ll rewrite it at the end.</span><span class="seg"><b>Learn (15 min):</b> Complete the Prompt Engineering Fundamentals module on Anthropic Academy. Focus on: clear instructions, context-setting, and avoiding ambiguity.</span><span class="seg"><b>Apply (5 min):</b> Rewrite that Jira ticket using what you just learned — structured, specific, with clear acceptance criteria.</span>'},
  {id:2,w:1,p:1,day:"Thu",title:"AI Collaboration with Claude",track:"People",
   url:"https://www.coursera.org/learn/ai-for-everyone-ai-collaboration-with-claude",
   instr:'<span class="seg"><b>Activate (5 min):</b> Think of one people management task this week that took too long to write (a review, update, or feedback note).</span><span class="seg"><b>Learn (15 min):</b> Start <em>AI Collaboration with Claude</em> on Coursera. Watch the workplace prompting module — focus on prompting strategies for different audiences and management communication.</span><span class="seg"><b>Apply (5 min):</b> Draft a short performance review note for one direct report using Claude. Prompt: <em>You are helping a manager write a clear, fair performance note. Employee context: [add details]. Write 3–4 sentences.</em></span>'},
  {id:3,w:1,p:1,day:"Fri",title:"Apply: draft review",track:"People",
   url:"https://claude.ai",
   instr:'<span class="seg"><b>Activate (5 min):</b> Choose one team member and gather their last month\'s highlights from Jira, Slack, or memory.</span><span class="seg"><b>Learn (15 min):</b> Iterate your review with Claude. Try: <em>You are an experienced engineering manager. Write a balanced, constructive performance review for [name] based on: [context]. Focus on impact, collaboration, and growth.</em></span><span class="seg"><b>Apply (5 min):</b> Polish and save the final output. Note which prompt variations produced the best result.</span>'},
  {id:4,w:2,p:1,day:"Mon",title:"Prompt Engineering Fundamentals — Pt 2",track:"QE",
   url:"https://anthropic.skilljar.com/claude-101",
   instr:'<span class="seg"><b>Activate (5 min):</b> Recall your best prompt from last week — what made it work? Write one sentence.</span><span class="seg"><b>Learn (15 min):</b> Continue Prompt Engineering Fundamentals — focus on chain-of-thought prompting. Key idea: asking Claude to <em>think step by step</em> before answering improves accuracy on complex tasks.</span><span class="seg"><b>Apply (5 min):</b> Ask Claude: <em>Think step by step. Analyze these defects from our last sprint: [list]. What are the top 3 risk patterns?</em> Compare to a version without chain-of-thought.</span>'},
  {id:5,w:2,p:1,day:"Tue",title:"Role + chain-of-thought",track:"QE",
   url:"https://anthropic.skilljar.com/claude-101",
   instr:'<span class="seg"><b>Activate (5 min):</b> Pull up your next upcoming CMS release — note the top 3 open risks.</span><span class="seg"><b>Learn (15 min):</b> Practice combining role prompting with chain-of-thought. Role = who Claude acts as. CoT = how it reasons. Together they produce expert-level analysis on complex QE decisions.</span><span class="seg"><b>Apply (5 min):</b> Run: <em>You are a senior QE lead with 10 years in enterprise software. Think step by step about the release risks given these open defects: [list]. Give me a go/no-go recommendation.</em></span>'},
  {id:6,w:2,p:1,day:"Thu",title:"Padel comms prompts",track:"Padel",
   url:"https://claude.ai",
   instr:'<span class="seg"><b>Activate (5 min):</b> List 3 Padel Zone communications you send weekly that take too long to write.</span><span class="seg"><b>Learn (15 min):</b> Build reusable prompt templates with variable placeholders like [player name], [session date], [drill focus]. Practice refining until the output needs zero editing.</span><span class="seg"><b>Apply (5 min):</b> Create and test 3 templates in Claude: (1) parent update email, (2) drill session description, (3) clinic registration announcement. Save the best version of each.</span>'},
  {id:7,w:2,p:1,day:"Fri",title:"Apply: clinic email",track:"Padel",
   url:"https://claude.ai",
   instr:'<span class="seg"><b>Activate (5 min):</b> Check this week\'s Junior Academy schedule and note key details: dates, coaches, drills.</span><span class="seg"><b>Learn (15 min):</b> Use your parent update template from Thursday and refine it until the output feels natural and on-brand for The Padel Zone.</span><span class="seg"><b>Apply (5 min):</b> Generate and send this week\'s parent update email. Note what needed editing — use that to improve your template for next time.</span>'},
  {id:8,w:3,p:1,day:"Mon",title:"Output structuring",track:"QE",
   url:"https://anthropic.skilljar.com/claude-101",
   instr:'<span class="seg"><b>Activate (5 min):</b> Think about the last report you sent to Vinay or Venkat — how could the structure be clearer?</span><span class="seg"><b>Learn (15 min):</b> Study how to control Claude\'s output format — tables, JSON, markdown, bullet lists. The key: explicitly specify format in your prompt, not just the content you want.</span><span class="seg"><b>Apply (5 min):</b> Ask Claude: <em>Produce a release risk summary as a structured table with columns: Component | Risk Level | Open Defects | Mitigation. Here\'s my data: [paste].</em></span>'},
  {id:9,w:3,p:1,day:"Tue",title:"Prompt Eng. for Generative AI (LinkedIn)",track:"People",
   url:"https://www.linkedin.com/learning/introduction-to-prompt-engineering-for-generative-ai-24636124",
   instr:'<span class="seg"><b>Activate (5 min):</b> Think of one management communication this week that felt robotic or unclear.</span><span class="seg"><b>Learn (15 min):</b> Start <em>Introduction to Prompt Engineering for Generative AI</em> on LinkedIn Learning (first 15 min). Focus on framing prompts for management communication — tone, audience, and length control.</span><span class="seg"><b>Apply (5 min):</b> Take that robotic message and rewrite it with Claude using the framing techniques from the course. Compare the two versions.</span>'},
  {id:10,w:3,p:1,day:"Thu",title:"Phase 1 review",track:"All",
   url:"https://claude.ai",
   instr:'<span class="seg"><b>Activate (5 min):</b> List the top 3 prompting techniques you\'ve used this phase from memory — no notes.</span><span class="seg"><b>Learn (15 min):</b> Open Claude and teach it back: <em>I want to explain prompt engineering to a new QE engineer. Here are the top 3 techniques I\'ve learned: [list]. Help me make this explanation clearer and more concrete.</em></span><span class="seg"><b>Apply (5 min):</b> Note any gaps in your explanation. If you struggled to explain something clearly, you don\'t fully own it yet — add it to next week\'s focus.</span>'},
  {id:11,w:3,p:1,day:"Fri",title:"Apply: all 3 domains",track:"All",
   url:"https://claude.ai",
   instr:'<span class="seg"><b>Activate (5 min):</b> Pick one real task from each domain: one QE, one people management, one Padel Zone.</span><span class="seg"><b>Learn (15 min):</b> Run each through Claude using the best technique for that task. Compare your prompts now vs Week 1 — are they cleaner, more specific, better structured?</span><span class="seg"><b>Apply (5 min):</b> Rate each output 1–5. If any score below 4, rewrite the prompt and try once more. Save your best three prompts.</span>'},

  // ── Phase 2 · Applied ─────────────────────────────────────────────────────
  {id:12,w:4,p:2,day:"Mon",title:"Claude Code in Action — Pt 1",track:"QE",
   url:"https://anthropic.skilljar.com/claude-code-in-action",
   instr:'<span class="seg"><b>Activate (5 min):</b> Describe your Karate Framework test structure in one paragraph — just write it out, no Claude yet.</span><span class="seg"><b>Learn (15 min):</b> Start <em>Claude Code in Action</em> on Anthropic Academy. Watch the architecture overview — understand how Claude works inside a codebase, not just a chat window.</span><span class="seg"><b>Apply (5 min):</b> Paste your Karate Framework description into Claude and ask: <em>As a senior test architect, what improvements would you suggest to this structure? Focus on maintainability and coverage gaps.</em></span>'},
  {id:13,w:4,p:2,day:"Tue",title:"Claude Code in Action — Pt 2",track:"QE",
   url:"https://anthropic.skilljar.com/claude-code-in-action",
   instr:'<span class="seg"><b>Activate (5 min):</b> Think of a complex QE analysis where context broke down across multiple messages — what went wrong?</span><span class="seg"><b>Learn (15 min):</b> Continue Claude Code in Action — context management module. Key insight: how to keep long conversations coherent using summaries, anchors, and explicit re-framing.</span><span class="seg"><b>Apply (5 min):</b> Start a multi-turn QE defect analysis. After each turn, summarize what Claude has learned before asking your next question. See if consistency improves.</span>'},
  {id:14,w:4,p:2,day:"Thu",title:"Claude Projects setup",track:"People",
   url:"https://claude.ai",
   instr:'<span class="seg"><b>Activate (5 min):</b> List the 3 pieces of context you wish Claude always knew about your team: structure, norms, terminology.</span><span class="seg"><b>Learn (15 min):</b> Set up your first Claude Project named <em>QE Management</em>. Add: (1) your team structure, (2) defect category definitions, (3) communication tone guide. These become permanent context for every conversation.</span><span class="seg"><b>Apply (5 min):</b> Test it with a real question: <em>Draft a stakeholder update — we closed 12 of 15 defects, 2 are blocked on CMS infra.</em> Note how the persistent context changes the output.</span>'},
  {id:15,w:4,p:2,day:"Fri",title:"Apply: QE Project",track:"QE",
   url:"https://claude.ai",
   instr:'<span class="seg"><b>Activate (5 min):</b> Pick the most time-consuming QE task from this week.</span><span class="seg"><b>Learn (15 min):</b> Run that task through your QE Management Project. Then run the same prompt in a fresh Claude chat without Project context. Compare both outputs.</span><span class="seg"><b>Apply (5 min):</b> Document the quality difference. What context made the biggest impact? Add one more piece of context to your Project based on what you learned.</span>'},
  {id:16,w:5,p:2,day:"Mon",title:"Claude Code in Action — Pt 3",track:"QE",
   url:"https://anthropic.skilljar.com/claude-code-in-action",
   instr:'<span class="seg"><b>Activate (5 min):</b> Map your current PR review process — where does it slow down or create bottlenecks?</span><span class="seg"><b>Learn (15 min):</b> Watch the GitHub workflow integration section in Claude Code in Action. Focus on how Claude assists with code review, PR summaries, and test gap detection.</span><span class="seg"><b>Apply (5 min):</b> Sketch a concrete plan: which 2 steps in your CMS team\'s PR workflow could Claude assist with? Write the prompt you\'d use for each.</span>'},
  {id:17,w:5,p:2,day:"Tue",title:"Hands-On Data Analysis with Claude (LinkedIn)",track:"QE",
   url:"https://www.linkedin.com/learning/hands-on-data-analysis-with-claude",
   instr:'<span class="seg"><b>Activate (5 min):</b> Export or copy 10–15 rows from your latest Jira defect report.</span><span class="seg"><b>Learn (15 min):</b> Watch <em>Hands-On Data Analysis with Claude</em> on LinkedIn Learning (first 15 min). Focus on how to paste structured data and ask analytical questions effectively.</span><span class="seg"><b>Apply (5 min):</b> Paste your Jira data into Claude and ask: <em>Analyze these defects. Identify: (1) severity trend, (2) most affected components, (3) recommended sprint focus for next week.</em></span>'},
  {id:18,w:5,p:2,day:"Thu",title:"Claude Cowork",track:"People",
   url:"https://anthropic.skilljar.com/introduction-to-claude-cowork",
   instr:'<span class="seg"><b>Activate (5 min):</b> List 3 daily tasks where you could collaborate with a team member and Claude together.</span><span class="seg"><b>Learn (15 min):</b> Complete <em>Everyday Productivity with Claude Cowork</em> on Anthropic Academy (23 min total — watch at 1.5× if needed). Focus on shared Projects and team context.</span><span class="seg"><b>Apply (5 min):</b> Add your direct report list to your QE Project with brief notes on each person\'s focus area. This enables personalized management advice from Claude.</span>'},
  {id:19,w:5,p:2,day:"Fri",title:"Apply: sprint metrics",track:"QE",
   url:"https://claude.ai",
   instr:'<span class="seg"><b>Activate (5 min):</b> Pull your last sprint\'s final defect numbers — total opened, closed, carry-over, severity split.</span><span class="seg"><b>Learn (15 min):</b> Run a full analysis in your QE Project: <em>You are a QE manager preparing a sprint report for engineering leadership. Here\'s our sprint data: [paste]. Produce: (1) trend summary, (2) top 3 risks, (3) recommendation for next sprint.</em></span><span class="seg"><b>Apply (5 min):</b> Review the output and send or present it. This is real work — not practice.</span>'},
  {id:20,w:6,p:2,day:"Mon",title:"Claude Code in Action — Pt 4",track:"QE",
   url:"https://anthropic.skilljar.com/claude-code-in-action",
   instr:'<span class="seg"><b>Activate (5 min):</b> Map your current CMS release pipeline — write the 5 key steps from code freeze to go-live.</span><span class="seg"><b>Learn (15 min):</b> Watch <em>Build with AI: Generate an API with CI/CD</em> in Claude Code. Focus on where AI fits in a release pipeline — not replacing steps, but making them faster.</span><span class="seg"><b>Apply (5 min):</b> Identify the one CMS release step where manual effort is highest. Write a one-paragraph proposal for how Claude could reduce it.</span>'},
  {id:21,w:6,p:2,day:"Tue",title:"AI Automation with Claude (Coursera)",track:"Padel",
   url:"https://www.coursera.org/learn/ai-for-everyone-ai-automation-with-claude",
   instr:'<span class="seg"><b>Activate (5 min):</b> Pick your next upcoming Padel Zone clinic — note the age group, theme, and key selling points.</span><span class="seg"><b>Learn (15 min):</b> Start <em>AI Automation with Claude</em> on Coursera. Focus on how to build reusable AI-powered content workflows and automate repetitive writing tasks.</span><span class="seg"><b>Apply (5 min):</b> Generate 3 versions of a clinic promotion with different tones: informative, enthusiastic, parent-focused. Keep the best elements from each.</span>'},
  {id:22,w:6,p:2,day:"Thu",title:"Padel content pipeline",track:"Padel",
   url:"https://claude.ai",
   instr:'<span class="seg"><b>Activate (5 min):</b> Define your pipeline inputs — what do you always know before a clinic? Theme, age group, coach, date, max participants.</span><span class="seg"><b>Learn (15 min):</b> Build and test a repeatable prompt chain: input = [clinic theme + age group] → outputs = drill description + parent email + social post. Run once with test data to refine.</span><span class="seg"><b>Apply (5 min):</b> Run the pipeline for your next real upcoming clinic. Save the output and note what needed editing.</span>'},
  {id:23,w:6,p:2,day:"Fri",title:"Apply: clinic social post",track:"Padel",
   url:"https://claude.ai",
   instr:'<span class="seg"><b>Activate (5 min):</b> Check which Padel Zone channel needs content this week: Instagram, WhatsApp, or email.</span><span class="seg"><b>Learn (15 min):</b> Use your content pipeline to generate this week\'s social post. Iterate until the tone, length, and CTA feel right for the channel.</span><span class="seg"><b>Apply (5 min):</b> Post it. Note the engagement vs your non-AI posts and refine the template accordingly.</span>'},
  {id:24,w:7,p:2,day:"Mon",title:"Multi-turn workflows",track:"QE",
   url:"https://claude.ai",
   instr:'<span class="seg"><b>Activate (5 min):</b> Choose a real upcoming CMS release — have its defect list and test results ready.</span><span class="seg"><b>Learn (15 min):</b> Practice a full multi-turn QE workflow: Turn 1 → ticket review, Turn 2 → test strategy, Turn 3 → risk assessment, Turn 4 → sign-off recommendation. Each turn builds on the last.</span><span class="seg"><b>Apply (5 min):</b> Complete the workflow on your real release. Does the final recommendation match your own judgment? Note any discrepancies.</span>'},
  {id:25,w:7,p:2,day:"Tue",title:"People mgmt prompts",track:"People",
   url:"https://claude.ai",
   instr:'<span class="seg"><b>Activate (5 min):</b> List the 5 most frequent people management writing tasks you do: 1:1 prep, feedback, announcements, escalations, recognition.</span><span class="seg"><b>Learn (15 min):</b> Build one reusable prompt template for each. Include clear placeholders: [employee name], [context], [tone], [outcome needed]. Make them generic enough to reuse every sprint.</span><span class="seg"><b>Apply (5 min):</b> Test each with a real example. Save all 5 to your QE Management Claude Project so they\'re always available.</span>'},
  {id:26,w:7,p:2,day:"Thu",title:"Phase 2 review",track:"All",
   url:"https://claude.ai",
   instr:'<span class="seg"><b>Activate (5 min):</b> List every workflow or template you\'ve built in Phase 2: Projects, sprint analysis, content pipeline, people prompts.</span><span class="seg"><b>Learn (15 min):</b> Ask Claude: <em>I\'ve built these workflows: [list them]. Given my goal of automating QE reporting, people management, and Padel Zone communications — what gaps remain?</em></span><span class="seg"><b>Apply (5 min):</b> Prioritize the top 2 gaps. Add them to your Week 8 plan — they become your Phase 3 focus.</span>'},
  {id:27,w:7,p:2,day:"Fri",title:"Apply: full workflow",track:"All",
   url:"https://claude.ai",
   instr:'<span class="seg"><b>Activate (5 min):</b> Choose one real task from each domain — pick the most valuable, not the easiest.</span><span class="seg"><b>Learn (15 min):</b> Run each end-to-end using your best templates and Projects: QE sprint summary, team management email, Padel Zone session plan.</span><span class="seg"><b>Apply (5 min):</b> Compare output quality to Week 1. Write 2 sentences on how your Claude usage has changed. This is your Phase 2 capstone.</span>'},

  // ── Phase 3 · Advanced ────────────────────────────────────────────────────
  {id:28,w:8,p:3,day:"Mon",title:"MCP Skills for Claude Code — Pt 1",track:"QE",
   url:"https://anthropic.skilljar.com/introduction-to-model-context-protocol",
   instr:'<span class="seg"><b>Activate (5 min):</b> List 2 external systems in your QE workflow that hold data you repeatedly copy-paste into Claude (e.g. Jira, GitHub, Confluence).</span><span class="seg"><b>Learn (15 min):</b> Start <em>MCP Skills for Claude Code</em> on Anthropic Academy. MCP = a standard protocol that lets Claude connect directly to external tools — no more manual copy-paste.</span><span class="seg"><b>Apply (5 min):</b> For each system you listed, write: <em>If Claude could read [system] directly, I could ask it to [task].</em> This defines your MCP use cases for Phase 4.</span>'},
  {id:29,w:8,p:3,day:"Tue",title:"MCP Skills for Claude Code — Pt 2",track:"QE",
   url:"https://anthropic.skilljar.com/introduction-to-model-context-protocol",
   instr:'<span class="seg"><b>Activate (5 min):</b> Review your MCP use cases from yesterday — which system would give you the most value first?</span><span class="seg"><b>Learn (15 min):</b> Continue MCP — tool integration module. A tool schema tells Claude what a tool does, what inputs it needs, and what it returns. Learn to write one.</span><span class="seg"><b>Apply (5 min):</b> Sketch a tool schema in plain English: Name: <em>JiraDefectReader</em>. Input: sprint ID. Output: list of defects with severity and status. This becomes your N8N node spec.</span>'},
  {id:30,w:8,p:3,day:"Thu",title:"Sub-agents in Claude Code — Pt 1",track:"Advanced",
   url:"https://anthropic.skilljar.com/introduction-to-subagents",
   instr:'<span class="seg"><b>Activate (5 min):</b> Think of a complex QE task that requires multiple steps — where would specialist focus help?</span><span class="seg"><b>Learn (15 min):</b> Start <em>Sub-agents in Claude Code</em>. Key concept: a master agent delegates subtasks to specialist sub-agents, then combines their outputs. Better than one agent doing everything.</span><span class="seg"><b>Apply (5 min):</b> Design your 3-agent QE architecture: Agent 1 = Ticket Reader, Agent 2 = Risk Assessor, Agent 3 = Report Writer. Define the input and output for each agent.</span>'},
  {id:31,w:8,p:3,day:"Fri",title:"Apply: MCP prototype",track:"QE",
   url:"https://claude.ai",
   instr:'<span class="seg"><b>Activate (5 min):</b> Pull your latest sprint\'s Jira defect data — copy it into a text file.</span><span class="seg"><b>Learn (15 min):</b> Build a manual MCP prototype — simulate what your JiraDefectReader agent would do: <em>You are a QE risk analysis agent. Here\'s the sprint defect data: [paste]. Produce a structured release risk report: severity breakdown, top 3 risks, and go/no-go recommendation.</em></span><span class="seg"><b>Apply (5 min):</b> Does the report match what you\'d write manually? This is your proof of concept — the N8N automation in Week 11 will do this automatically.</span>'},
  {id:32,w:9,p:3,day:"Mon",title:"Building with the Claude API (Coursera)",track:"QE",
   url:"https://www.coursera.org/learn/building-with-the-claude-api",
   instr:'<span class="seg"><b>Activate (5 min):</b> Review your 3-agent QE architecture from Week 8 — are the inputs and outputs for each agent clearly defined?</span><span class="seg"><b>Learn (15 min):</b> Start <em>Building with the Claude API</em> on Coursera — focus on the agentic workflows and tool-use modules. Learn how to formally define agent inputs, outputs, and decision rules.</span><span class="seg"><b>Apply (5 min):</b> Write a schema for your QE defect triage tool: <code>{ input: { sprint_id, defect_list }, output: { risk_tier, recommendation, blockers } }</code>. This becomes your N8N workflow spec in Week 11.</span>'},
  {id:33,w:9,p:3,day:"Tue",title:"Vibe Coding with Claude Code (Scrimba)",track:"Dev",
   url:"https://www.coursera.org/learn/introduction-to-claude-code",
   instr:'<span class="seg"><b>Activate (5 min):</b> Think of one small tool you\'ve always wanted to build but lacked the coding skills for.</span><span class="seg"><b>Learn (15 min):</b> Start <em>Vibe Coding with Claude Code</em> on Scrimba. Use the interactive editor — don\'t just watch. Key skill: describe what you want in plain language, let Claude write the code, then iterate.</span><span class="seg"><b>Apply (5 min):</b> Complete the first interactive exercise. Practice the describe → generate → test → refine loop even if you don\'t fully understand the generated code.</span>'},
  {id:34,w:9,p:3,day:"Thu",title:"Sub-agents in Claude Code — Pt 2",track:"Advanced",
   url:"https://anthropic.skilljar.com/introduction-to-subagents",
   instr:'<span class="seg"><b>Activate (5 min):</b> Review your 3-agent QE architecture — draw how data flows between agents as arrows on paper.</span><span class="seg"><b>Learn (15 min):</b> Continue sub-agents — routing patterns. Parallel = agents work simultaneously on independent tasks. Sequential = each agent\'s output feeds the next. Learn when to use each.</span><span class="seg"><b>Apply (5 min):</b> Update your architecture with explicit routing: Agent 1 → Agent 2 → Agent 3 (sequential). Define what happens if Agent 2 finds no significant risks — does Agent 3 still run?</span>'},
  {id:35,w:9,p:3,day:"Fri",title:"Apply: Jira agent prototype",track:"QE",
   url:"https://claude.ai",
   instr:'<span class="seg"><b>Activate (5 min):</b> Collect a real list of open defects from your current sprint — minimum 8 items with severity and component.</span><span class="seg"><b>Learn (15 min):</b> Build a working prototype by simulating all 3 agents in sequence: paste defect list → Agent 1 categorizes → Agent 2 scores risks → Agent 3 writes go/no-go. Run each step as a separate Claude message.</span><span class="seg"><b>Apply (5 min):</b> Would you present this recommendation to Vinay or Venkat? If yes, you\'re ready for N8N. If not, note what\'s missing and fix it.</span>'},
  {id:36,w:10,p:3,day:"Mon",title:"Building with the Claude API — Pt 1",track:"Padel",
   url:"https://www.coursera.org/learn/building-with-the-claude-api",
   instr:'<span class="seg"><b>Activate (5 min):</b> Map the Padel Zone booking process end-to-end — what are the 3 steps from member inquiry to confirmation?</span><span class="seg"><b>Learn (15 min):</b> Continue <em>Building with the Claude API</em> on Coursera — focus on the API orchestration and prompt chaining modules. The output of one Claude call becomes the input of the next.</span><span class="seg"><b>Apply (5 min):</b> Design a 3-step chain: Step 1 = parse inquiry, Step 2 = check availability, Step 3 = generate confirmation draft. Write the Claude prompt for each step.</span>'},
  {id:37,w:10,p:3,day:"Tue",title:"Building with the Claude API — Pt 2",track:"Advanced",
   url:"https://www.coursera.org/learn/building-with-the-claude-api",
   instr:'<span class="seg"><b>Activate (5 min):</b> Review your Padel Zone content pipeline from Week 6 — which step takes the most time to get right?</span><span class="seg"><b>Learn (15 min):</b> Continue API orchestration — parallel processing. Instead of drill description → email → social post in sequence, all three generate simultaneously from one input.</span><span class="seg"><b>Apply (5 min):</b> Rebuild your content pipeline as a parallel chain: one master prompt with 3 output sections. Test with your next clinic and measure time saved vs sequential.</span>'},
  {id:38,w:10,p:3,day:"Thu",title:"Padel club agent",track:"Padel",
   url:"https://claude.ai",
   instr:'<span class="seg"><b>Activate (5 min):</b> Write 5 real member inquiry questions you\'ve received at The Padel Zone: pricing, availability, academy details, bookings, etc.</span><span class="seg"><b>Learn (15 min):</b> Build a member inquiry agent. System prompt: <em>You are a helpful assistant for The Padel Zone. Answer member questions about clinic availability, pricing, and registration. Always end with a specific next step for the member.</em></span><span class="seg"><b>Apply (5 min):</b> Run all 5 real questions through the agent. Rate each response 1–5. Refine the system prompt based on the weakest responses.</span>'},
  {id:39,w:10,p:3,day:"Fri",title:"Phase 3 review",track:"All",
   url:"https://claude.ai",
   instr:'<span class="seg"><b>Activate (5 min):</b> List every agent and prototype built in Phase 3: MCP prototype, Jira agent, booking assistant, content chain, member inquiry agent.</span><span class="seg"><b>Learn (15 min):</b> Evaluate each: (1) does the input/output spec work reliably? (2) Is it ready for automation? (3) What would break it? Identify the 2 most production-ready for N8N.</span><span class="seg"><b>Apply (5 min):</b> Write a one-paragraph input/output spec for each of the 2 chosen agents. You\'ll need this in Week 11 to build the N8N workflows.</span>'},

  // ── Phase 4 · Automation ──────────────────────────────────────────────────
  {id:40,w:11,p:4,day:"Mon",title:"N8N + Claude API setup",track:"Auto",
   url:"https://padelzone.app.n8n.cloud/",
   instr:'<span class="seg"><b>Activate (5 min):</b> Open your N8N instance and confirm your Anthropic API key is configured under Credentials.</span><span class="seg"><b>Learn (15 min):</b> Create your first Claude workflow in N8N: HTTP Request node → Anthropic API (https://api.anthropic.com/v1/messages) → set headers and body. Test with a simple prompt: <em>Summarize this in one sentence: [test text].</em></span><span class="seg"><b>Apply (5 min):</b> Confirm the workflow runs and returns a valid response. This foundation node is the building block for all 5 automations you\'ll build this week and next.</span>'},
  {id:41,w:11,p:4,day:"Tue",title:"Sprint report flow",track:"QE",
   url:"https://padelzone.app.n8n.cloud/",
   instr:'<span class="seg"><b>Activate (5 min):</b> Review your Jira agent prototype from Week 9 — this Claude prompt goes directly into today\'s N8N flow.</span><span class="seg"><b>Learn (15 min):</b> Build the QE Sprint Report workflow: Node 1 = Jira API fetches open defects. Node 2 = Claude produces risk triage using your Week 9 prompt. Node 3 = Gmail emails the report to stakeholders.</span><span class="seg"><b>Apply (5 min):</b> Run a test with real sprint data. Check the email arrived and the content is accurate. Fix any node errors before tomorrow.</span>'},
  {id:42,w:11,p:4,day:"Thu",title:"Booking assistant flow",track:"Padel",
   url:"https://padelzone.app.n8n.cloud/",
   instr:'<span class="seg"><b>Activate (5 min):</b> Review your Padel Zone booking agent prompt from Week 10 — this becomes your Claude node content.</span><span class="seg"><b>Learn (15 min):</b> Build the booking assistant workflow: Node 1 = form submission trigger (Typeform or webhook). Node 2 = Claude generates confirmation + clinic upsell. Node 3 = Gmail sends response to the member.</span><span class="seg"><b>Apply (5 min):</b> Test with a dummy booking submission. Confirm the email landed correctly and Claude\'s response matches your Week 10 agent quality.</span>'},
  {id:43,w:11,p:4,day:"Fri",title:"Apply: live N8N run",track:"Auto",
   url:"https://padelzone.app.n8n.cloud/",
   instr:'<span class="seg"><b>Activate (5 min):</b> Confirm both workflows are active in N8N — Sprint Report and Booking Assistant.</span><span class="seg"><b>Learn (15 min):</b> Run both with real data: Sprint report → use actual current sprint defects → email stakeholders. Booking assistant → submit a real test inquiry → check the member response.</span><span class="seg"><b>Apply (5 min):</b> Debug any failures, document what each workflow does, and calculate the time saved vs doing it manually.</span>'},
  {id:44,w:12,p:4,day:"Mon",title:"Perf review pipeline",track:"People",
   url:"https://padelzone.app.n8n.cloud/",
   instr:'<span class="seg"><b>Activate (5 min):</b> List your 7 direct reports with 2–3 bullet points of context each: recent wins, focus areas, development needs.</span><span class="seg"><b>Learn (15 min):</b> Build the performance review workflow in N8N: Node 1 = scheduled trigger (first Monday of review cycle). Node 2 = loop through each direct report and call Claude with their context. Node 3 = output review drafts to Gmail or Google Docs.</span><span class="seg"><b>Apply (5 min):</b> Run with all 7 reports. How much editing does each draft need? Target: less than 5 min editing per person.</span>'},
  {id:45,w:12,p:4,day:"Tue",title:"Release risk digest",track:"QE",
   url:"https://padelzone.app.n8n.cloud/",
   instr:'<span class="seg"><b>Activate (5 min):</b> Review your Sprint Report workflow from Week 11 — what data is missing to make it a full release digest?</span><span class="seg"><b>Learn (15 min):</b> Extend it into a Release Risk Digest: add Node 1b = fetch test results summary, Node 1c = fetch Git commit summary. Claude now combines defects + test results + commits into a go/no-go recommendation. Schedule every Friday at 4pm.</span><span class="seg"><b>Apply (5 min):</b> Run it with this week\'s data. Is the go/no-go recommendation accurate? If not, refine the Claude prompt.</span>'},
  {id:46,w:12,p:4,day:"Thu",title:"Junior Academy comms",track:"Padel",
   url:"https://padelzone.app.n8n.cloud/",
   instr:'<span class="seg"><b>Activate (5 min):</b> List the information you have after each Junior Academy session: player names, level, drills covered, coach notes.</span><span class="seg"><b>Learn (15 min):</b> Build the parent comms workflow: Node 1 = session completion trigger. Node 2 = loop through each player, Claude generates a personalized parent update based on level and session notes. Node 3 = Gmail sends to each parent.</span><span class="seg"><b>Apply (5 min):</b> Test with a real recent session. Does each message feel personal and specific? Adjust the prompt until it does.</span>'},
  {id:47,w:12,p:4,day:"Fri",title:"Capstone: all flows live",track:"All",
   url:"https://padelzone.app.n8n.cloud/",
   instr:'<span class="seg"><b>Activate (5 min):</b> Open N8N. You should have 6 active workflows: Sprint Report, Booking Assistant, Perf Reviews, Release Digest, Junior Academy Comms, Content Generator.</span><span class="seg"><b>Learn (15 min):</b> Run each workflow one final time. Check outputs for quality, timing, and errors. Fix anything that needs refinement — this is your production environment now, not a prototype.</span><span class="seg"><b>Apply (5 min):</b> Write one sentence per workflow: what it does, how often it runs, and what manual task it replaces. You are no longer a learner — you are a builder.</span>'}
];

function setSync(state, msg) {
  const d = document.getElementById('sdot');
  const l = document.getElementById('slbl');
  if (!d || !l) return;
  d.className = 'sync-dot' + (state ? ' ' + state : '');
  l.textContent = msg;
}

// ─────────────────────────────────────────────
const SHEET_NAME = 'Progress';
const SHEET_RANGE = `${SHEET_NAME}!A:C`;

async function sheetsGet(sheetId) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${encodeURIComponent(SHEET_RANGE)}`;
  const r = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
  if (!r.ok) throw new Error('Sheets read failed: ' + r.status);
  const d = await r.json();
  return d.values || [];
}

async function sheetsAppend(sheetId, values) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${encodeURIComponent(SHEET_RANGE)}:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`;
  const r = await fetch(url, {
    method: 'POST',
    headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ values })
  });
  if (!r.ok) throw new Error('Sheets append failed: ' + r.status);
}

async function sheetsClear(sheetId) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${encodeURIComponent(SHEET_RANGE)}:clear`;
  const r = await fetch(url, { method: 'POST', headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' } });
  if (!r.ok) throw new Error('Sheets clear failed: ' + r.status);
}

async function loadFromSheets() {
  if (!accessToken || !cfg) return;
  setSync('busy', 'Loading...');
  try {
    const rows = await sheetsGet(cfg.sheetId);
    // rows: [[session_id, done, updated_at], ...]
    // skip header row if present
    const dataRows = rows.filter(r => r[0] !== 'session_id' && r[0] !== undefined);
    done = dataRows.filter(r => r[1] === 'TRUE' || r[1] === 'true').map(r => parseInt(r[0])).filter(n => !isNaN(n));
    localStorage.setItem('pdp_done', JSON.stringify(done));
    setSync('ok', 'Synced · ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
    render();
  } catch (e) {
    console.error(e);
    setSync('err', 'Sync error — using local');
  }
}

async function saveToSheets() {
  if (!accessToken || !cfg) return;
  setSync('busy', 'Saving...');
  try {
    // Write header + all done states
    await sheetsClear(cfg.sheetId);
    const header = [['session_id', 'done', 'updated_at']];
    const ts = new Date().toISOString();
    const rows = SESSIONS.map(s => [String(s.id), String(done.includes(s.id)), ts]);
    await sheetsAppend(cfg.sheetId, [...header, ...rows]);
    setSync('ok', 'Saved · ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
  } catch (e) {
    console.error(e);
    setSync('err', 'Save failed');
  }
}

// ─────────────────────────────────────────────
// GOOGLE SIGN-IN (GIS)
// ─────────────────────────────────────────────
let tokenClient = null;

function initGIS() {
  if (!cfg || !window.google) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: cfg.clientId,
    scope: 'https://www.googleapis.com/auth/spreadsheets',
    callback: (resp) => {
      if (resp.error) { setSync('err', 'Auth error'); return; }
      accessToken = resp.access_token;
      userEmail = ''; // GIS token client doesn't return email directly
      document.getElementById('signin-btn').style.display = 'none';
      document.getElementById('signout-btn').style.display = 'flex';
      setSync('ok', 'Signed in');
      loadFromSheets();
    }
  });
}

function signIn() {
  if (!tokenClient) { alert('Please save your configuration first.'); return; }
  tokenClient.requestAccessToken();
}

function signOut() {
  if (accessToken) google.accounts.oauth2.revoke(accessToken, () => {});
  accessToken = null;
  document.getElementById('signin-btn').style.display = 'flex';
  document.getElementById('signout-btn').style.display = 'none';
  setSync('', 'Not signed in');
}

// ─────────────────────────────────────────────
// TOGGLE DONE
// ─────────────────────────────────────────────
async function toggleDone(id, e) {
  e.stopPropagation();
  const idx = done.indexOf(id);
  if (idx > -1) done.splice(idx, 1); else done.push(id);
  localStorage.setItem('pdp_done', JSON.stringify(done));
  render();
  await saveToSheets();
}

function toggleRow(id) {
  const el = document.getElementById('row-' + id);
  if (el) el.classList.toggle('open');
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function getNext() { return SESSIONS.find(s => !done.includes(s.id)) || null; }

function renderMain() {
  const mc = document.getElementById('main-content');
  // cfg always set — proceed directly

  const next = getNext();
  const pct = Math.round(done.length / 48 * 100);
  const ring = document.getElementById('ring');
  if (ring) ring.style.strokeDashoffset = 125.6 - (125.6 * pct / 100);
  const rp = document.getElementById('ring-pct'); if (rp) rp.textContent = pct + '%';
  const dc = document.getElementById('done-ct'); if (dc) dc.textContent = done.length;

  // show signin button once cfg is set
  const sb = document.getElementById('signin-btn');
  const so = document.getElementById('signout-btn');
  if (sb && !accessToken) sb.style.display = 'flex';
  if (so && accessToken) so.style.display = 'flex';

  let html = '';

  // Today banner
  if (!next) {
    html += `<div class="today-banner"><div class="today-left"><div class="today-eye">Complete</div><div class="today-title">All 48 sessions done.</div><div class="today-instr">Every automation is live. You built it — congratulations.</div></div></div>`;
  } else {
    const tc = TC[next.track] || 'var(--rev)';
    html += `<div class="today-banner">
      <div class="today-left">
        <div class="today-eye">Up next · ${next.day}, Week ${next.w}</div>
        <div class="today-title">${next.title}</div>
        <div class="today-meta">
          <span class="pill" style="background:${TB[next.track]};color:${tc}">${next.track}</span>
          <span style="font-size:11px;color:var(--dim)">8:30 – 8:55am · 25 min</span>
          <span style="font-size:11px;color:var(--dim)">${PL[next.p]}</span>
        </div>
        <div class="today-instr">${next.instr}</div>
        <div class="today-btns">
          <a class="btn-go" href="${next.url}" target="_blank">Open course ↗</a>
          <button class="btn-check" onclick="toggleDone(${next.id}, event)">Mark done ✓</button>
        </div>
      </div>
      <div class="timer-col">
        <div class="timer-lbl">Session</div>
        <div class="trow"><div class="tblock" style="width:40px;background:var(--rev-bg);color:var(--rev)">5 min</div><div class="tname">Activate</div></div>
        <div class="trow"><div class="tblock" style="width:106px;background:var(--people-bg);color:var(--people)">15 min</div><div class="tname">Learn</div></div>
        <div class="trow"><div class="tblock" style="width:40px;background:var(--qe-bg);color:var(--qe)">5 min</div><div class="tname">Apply</div></div>
      </div>
    </div>`;
  }

  // Phase header
  if (curPhase !== 'all') {
    html += `<div class="ph-hdr"><div class="ph-hdr-title">${PL[curPhase]}</div><div class="ph-hdr-desc">${PD[curPhase]}</div></div>`;
  }

  // Sessions
  const items = curPhase === 'all' ? SESSIONS : SESSIONS.filter(s => s.p === curPhase);
  const weeks = [...new Set(items.map(s => s.w))];
  weeks.forEach(wk => {
    const ws = items.filter(s => s.w === wk);
    html += `<div class="wk-group"><div class="wk-label">Week ${wk}</div>`;
    ws.forEach(s => {
      const isDone = done.includes(s.id);
      const isNext = next && next.id === s.id;
      const tc = TC[s.track] || 'var(--rev)';
      html += `<div class="srow${isDone ? ' done' : ''}${isNext ? ' is-next' : ''}" id="row-${s.id}" onclick="toggleRow(${s.id})">
        <div class="chk${isDone ? ' done' : ''}" onclick="toggleDone(${s.id}, event)">
          <svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="sc">
          <div class="s-top">
            <span class="s-day">${s.day}</span>
            <span class="s-title${isDone ? ' x' : ''}">${s.title}</span>
            <span class="pill" style="background:${TB[s.track]};color:${tc}">${s.track}</span>
            ${isNext ? '<span class="next-tag">← next</span>' : ''}
          </div>
          <div class="s-instr">${s.instr}</div>
          <div class="s-acts">
            <a class="lnk" href="${s.url}" target="_blank" onclick="event.stopPropagation()">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              Open course
            </a>
            <button class="done-btn" onclick="toggleDone(${s.id}, event)">
              <svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              ${isDone ? 'Done' : 'Mark done'}
            </button>
          </div>
        </div>
      </div>`;
    });
    html += '</div>';
  });

  mc.innerHTML = html;

  // update ring after DOM update
  const r2 = document.getElementById('ring');
  if (r2) r2.style.strokeDashoffset = 125.6 - (125.6 * pct / 100);
  const rp2 = document.getElementById('ring-pct'); if (rp2) rp2.textContent = pct + '%';
  const dc2 = document.getElementById('done-ct'); if (dc2) dc2.textContent = done.length;
}

function render() {
  renderMain();
  // update phase buttons
  document.querySelectorAll('.ph-btn').forEach(b => b.classList.remove('active'));
  const ab = document.getElementById(curPhase === 'all' ? 'btn-all' : 'btn-' + curPhase);
  if (ab) ab.classList.add('active');
}

function showPhase(p) { curPhase = p; render(); }

// ─────────────────────────────────────────────
// SETUP HTML
// ─────────────────────────────────────────────
function setupHTML() {
  return '';
}
function saveConfig() {
  const sheetId = document.getElementById('inp-sheet').value.trim();
  const err = document.getElementById('cfg-err');
  if (!sheetId) { err.style.display = 'block'; return; }
  cfg = { clientId: '308835955166-f2ahsv1eu7370oq0bbq387o7juevap76.apps.googleusercontent.com', sheetId };
  localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
  initGIS();
  render();
  const sb = document.getElementById('signin-btn');
  if (sb) sb.style.display = 'flex';
}

// ─────────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────────
window.addEventListener('load', () => {
  render();
  document.getElementById('signin-btn').style.display = 'flex';
  const waitGIS = setInterval(() => {
    if (window.google && window.google.accounts) {
      clearInterval(waitGIS);
      initGIS();
    }
  }, 200);
  setSync('', 'Sign in to sync across devices');
});
</script>
